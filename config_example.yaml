# Activity Configuration Example
# Copy to ~/.config/activity/config.yaml

data_dir: "~/.local/share/activity"
debug: false                    # Enable debug logging

# PostgreSQL database configuration
# DSN can also be set via DATABASE_URL environment variable
database:
  dsn: "postgres://user:pass@localhost:5432/activity?sslmode=disable"
  max_open_conns: 25            # Maximum open connections (default: 25)
  max_idle_conns: 5             # Maximum idle connections (default: 5)
  conn_max_lifetime_seconds: 300 # Connection max lifetime in seconds (default: 300)

# Web server and authentication configuration
web:
  auth_header: "oidc-email"     # HTTP header containing user email
  seed_admin: "admin@example.com" # First admin email to create on startup
  dev_mode: false               # Bypass auth, use dev_user (for local development)
  dev_user: "dev@localhost"     # Email to use in dev mode
  require_auth: false           # Reject requests with 403 if auth header is missing

# Read-only API for AI-agent consumption. Runs on its own port, separate
# from the OIDC-protected web UI. Authenticates via static bearer tokens
# (Authorization: Bearer <token>). See api/openapi.yaml for the schema.
api:
  enabled: false                # Set true to start the API server
  host: "localhost"             # Bind host (use 0.0.0.0 to listen on all interfaces)
  port: 8081                    # Listen port
  # tokens:                     # Inline tokens (prefer tokens_env in production)
  #   - "your-bearer-token"
  tokens_env: "ACTIVITY_API_TOKENS"  # Env var with comma-separated tokens

llm:
  provider: "gemini"
  model: "gemini-3.0-flash"
  api_key_env: "GOOGLE_API_KEY"

  # Basic limits (apply to both modes)
  max_commits: 50           # Max commits to analyze per run
  max_message_length: 10000 # Truncate long commit messages

  # Phase 3: Agent mode (default) - intelligent diff fetching
  use_agent: true           # Set to false for Phase 2 simple mode
  max_diff_fetches: 20      # Max diffs agent can fetch per analysis
  max_diff_size_kb: 50      # Max size of each diff in KB
  max_pr_data_size_kb: 50   # Max size of pre-fetched PR data in KB
  max_total_tokens: 5000000 # ~$0.50 cost limit
  enable_tool_logs: true # Log agent tool calls for debugging

  # Optional: Custom prompts (leave blank to use defaults)
  # phase2_prompt: "Your custom Phase 2 prompt here"
  # agent_system_prompt: "Your custom agent instruction here"

# GitHub App authentication (for private repositories)
# Values can be set directly or via environment variables
github:
  # Direct values (takes precedence over env vars)
  # app_id: 12345
  # installation_id: 67890
  # private_key_path: "~/.config/activity/github-app.pem"

  # Environment variable names (defaults shown)
  app_id_env: "GITHUB_APP_ID"
  installation_id_env: "GITHUB_INSTALLATION_ID"
  private_key_env: "GITHUB_APP_PRIVATE_KEY"

# Newsletter email configuration (via SendGrid)
newsletter:
  enabled: false
  auto_send: false              # Automatically send newsletters (backward compat, prefer schedule)
  # sendgrid_api_key: ""        # Direct API key (takes precedence over env var)
  sendgrid_api_key_env: "SENDGRID_API_KEY"
  from_email: "activity@example.com"
  from_name: "Activity Digest"
  subject_prefix: "[Activity]"

# Weekly automation pipeline schedule
schedule:
  enabled: false                # Enable the weekly pipeline (update repos, generate reports, send newsletter)
  day: "monday"                 # Day of week to run
  hour: 2                       # Hour to run, 0-23
  minute: 42                    # Minute to run, 0-59
  notify_admins: true           # Email admins on pipeline errors

