openapi: 3.0.3
info:
  title: Activity API
  description: |
    Read-only API for accessing tracked repositories and weekly activity reports
    generated by the Activity service. Intended for consumption by AI agents and
    other automated clients.
  version: 1.0.0
servers:
  - url: /v1
    description: API v1
security:
  - bearerAuth: []
paths:
  /repos:
    get:
      operationId: listRepos
      summary: List repositories
      description: Returns all tracked repositories, optionally filtered by active status.
      parameters:
        - name: active
          in: query
          description: If set, only return repositories with this active state.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Repository list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /repos/{name}/reports:
    get:
      operationId: listReportsForRepo
      summary: List weekly reports for a repository
      description: Returns weekly report summaries for the named repository, most recent first.
      parameters:
        - name: name
          in: path
          required: true
          description: Repository name as registered in the system.
          schema:
            type: string
        - name: year
          in: query
          required: false
          description: If set, only return reports for the given ISO year.
          schema:
            type: integer
      responses:
        '200':
          description: Report summary list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{id}:
    get:
      operationId: getReport
      summary: Fetch a weekly report by ID
      description: Returns the full report including the AI-generated summary, authors, and per-commit metadata.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API token provided in `Authorization: Bearer <token>` header."
  responses:
    Unauthorized:
      description: Authentication required or token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Repository:
      type: object
      required:
        - id
        - name
        - url
        - branch
        - active
        - private
        - external
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        url:
          type: string
        branch:
          type: string
        active:
          type: boolean
        private:
          type: boolean
        external:
          type: boolean
          description: External repo - contributor analysis is included in summaries.
        description:
          type: string
          nullable: true
          description: AI-generated description from the project README.
        forge_type:
          type: string
          nullable: true
          enum: [github, forgejo, null]
        forge_owner:
          type: string
          nullable: true
        forge_repo:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_run_at:
          type: string
          format: date-time
          nullable: true
    ReportSummary:
      type: object
      required:
        - id
        - repo_id
        - year
        - week
        - week_start
        - week_end
        - commit_count
        - created_at
      properties:
        id:
          type: integer
          format: int64
        repo_id:
          type: integer
          format: int64
        year:
          type: integer
        week:
          type: integer
          description: ISO week number.
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        commit_count:
          type: integer
        created_at:
          type: string
          format: date-time
    Report:
      type: object
      required:
        - id
        - repo_id
        - year
        - week
        - week_start
        - week_end
        - commit_count
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        repo_id:
          type: integer
          format: int64
        year:
          type: integer
        week:
          type: integer
        week_start:
          type: string
          format: date
        week_end:
          type: string
          format: date
        summary:
          type: string
          nullable: true
          description: AI-generated narrative summary of activity in this week.
        commit_count:
          type: integer
        authors:
          type: array
          items:
            type: string
        author_counts:
          type: object
          additionalProperties:
            type: integer
          description: Map of author name to commit count.
        commits:
          type: array
          items:
            $ref: '#/components/schemas/Commit'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Commit:
      type: object
      required:
        - sha
        - author
        - date
        - message
      properties:
        sha:
          type: string
        author:
          type: string
        date:
          type: string
          format: date
        message:
          type: string
          description: First line of the commit message.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
